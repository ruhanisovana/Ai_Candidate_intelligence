<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Analyze Candidate</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        .candidate-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            background: white;
        }

        button,
        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 11px 18px;
            border: none;
            border-radius: 7px;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background: #2563eb;
            color: white;
        }

        .back {
            background: #64748b;
            color: white;
            margin-left: 8px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Analyze Candidate</h1>

        <div class="candidate-name">
            {{ candidate["full_name"] }}
        </div>

        <form
            action="/candidate/{{ candidate['id'] }}/analyze"
            method="POST"
        >

            <label for="job_id">
                Select Job
            </label>

            <select
                id="job_id"
                name="job_id"
                required
            >

                <option value="">
                    -- Select a job --
                </option>

                {% for job in jobs %}

                <option value="{{ job['id'] }}">
                    {{ job['job_title'] }}
                </option>

                {% endfor %}

            </select>

            <button type="submit">
                Analyze Candidate
            </button>

            <a
                href="/candidate/{{ candidate['id'] }}"
                class="back"
            >
                Back
            </a>

        </form>

    </div>

</div>

</body>

</html>
