
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Job</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ddd;
            border-radius: 7px;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        button,
        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 16px;
            border-radius: 7px;
            border: none;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background: #2563eb;
            color: white;
        }

        .back {
            background: #64748b;
            color: white;
            margin-left: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Create Job</h1>

        <form action="/create-job" method="POST">

            <label>
                Job Title
            </label>

            <input
                type="text"
                name="job_title"
                placeholder="Backend Developer"
                required
            >

            <label>
                Job Description
            </label>

            <textarea
                name="job_description"
                placeholder="Describe the job..."
                required
            ></textarea>

            <label>
                Required Skills
            </label>

            <input
                type="text"
                name="required_skills"
                placeholder="Python, Flask, SQL, REST API, GitHub"
                required
            >

            <button type="submit">
                Save Job
            </button>

            <a href="/" class="back">
                Back
            </a>

        </form>

    </div>

</div>

</body>

</html>
